<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AnimeStreamX — Stream Anime Free</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:       #07070d;
  --bg2:      #0d0d18;
  --bg3:      #12121f;
  --bg4:      #1a1a2e;
  --border:   #1e1e35;
  --border2:  #2a2a45;
  --accent:   #6c63ff;
  --accent2:  #a78bfa;
  --pink:     #f472b6;
  --text:     #e8e8f0;
  --text2:    #9090b0;
  --text3:    #55556a;
  --card-r:   12px;
  --trans:    .2s ease;
}

html, body { width: 100%; height: 100%; background: var(--bg); font-family: 'Inter', sans-serif; color: var(--text); overflow: hidden; }

#root { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

/* ── VIEWS ── */
#view-home, #view-player { position: absolute; inset: 0; transition: opacity .35s ease, transform .35s ease; }
#view-home   { z-index: 1; overflow-y: auto; overflow-x: hidden; }
#view-player { z-index: 2; opacity: 0; pointer-events: none; transform: translateY(20px); }
#view-player.active { opacity: 1; pointer-events: all; transform: translateY(0); }
#view-home.hidden { opacity: 0; pointer-events: none; }

/* ── SCROLLBAR ── */
::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 10px; }

/* ══════════ NAVBAR ══════════ */
#navbar {
  position: sticky; top: 0; z-index: 100;
  display: flex; align-items: center; gap: 16px;
  padding: 0 24px; height: 58px;
  background: rgba(7,7,13,.88);
  border-bottom: 1px solid var(--border);
  backdrop-filter: blur(12px);
  flex-shrink: 0;
}

.logo {
  font-family: 'Space Grotesk', sans-serif;
  font-weight: 700; font-size: 20px; letter-spacing: -.02em;
  background: linear-gradient(135deg, var(--accent), var(--pink));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text; white-space: nowrap; cursor: pointer; flex-shrink: 0;
}
.logo span { -webkit-text-fill-color: transparent; }

/* search */
#search-wrap {
  flex: 1; max-width: 480px;
  position: relative;
}
#search-inp {
  width: 100%; padding: 9px 16px 9px 40px;
  background: var(--bg3); border: 1px solid var(--border2);
  border-radius: 24px; color: var(--text); font-size: 13.5px;
  outline: none; transition: border-color var(--trans), box-shadow var(--trans);
}
#search-inp::placeholder { color: var(--text3); }
#search-inp:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(108,99,255,.15); }
.search-icon {
  position: absolute; left: 13px; top: 50%; transform: translateY(-50%);
  color: var(--text3); pointer-events: none;
}

/* dropdown results */
#search-dropdown {
  position: absolute; top: calc(100% + 6px); left: 0; right: 0;
  background: var(--bg3); border: 1px solid var(--border2);
  border-radius: 14px; overflow: hidden;
  box-shadow: 0 16px 40px rgba(0,0,0,.6);
  z-index: 200; display: none;
  max-height: 500px; overflow-y: auto;
}
#search-dropdown.show { display: block; }
#search-dropdown.show { display: block; }
.sd-item {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 12px; cursor: pointer;
  transition: background var(--trans);
  border-bottom: 1px solid var(--border);
}
.sd-item:last-child { border-bottom: none; }
.sd-item:hover { background: var(--bg4); }
.sd-img { width: 36px; height: 50px; object-fit: cover; border-radius: 5px; flex-shrink: 0; background: var(--bg4); }
.sd-info { flex: 1; min-width: 0; }
.sd-title { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sd-meta  { font-size: 11px; color: var(--text2); margin-top: 2px; }
.sd-score { font-size: 11px; color: #fbbf24; }

.nav-btn {
  padding: 7px 16px; border-radius: 20px; border: 1px solid var(--border2);
  background: transparent; color: var(--text2); font-size: 12px; font-weight: 600;
  cursor: pointer; transition: all var(--trans); white-space: nowrap;
}
.nav-btn:hover { border-color: var(--accent); color: var(--accent); }

/* ══════════ HOME PAGE ══════════ */
#view-home {
  background: var(--bg);
  padding-top: 0;
}

/* Hero */
#hero {
  position: relative; overflow: hidden;
  min-height: 420px; display: flex; align-items: flex-end;
  padding: 0 32px 40px;
  background: linear-gradient(135deg, #0d0d20 0%, #0a0010 50%, #070710 100%);
}
#hero-bg {
  position: absolute; inset: 0;
  background-size: cover; background-position: center top;
  opacity: 0; transition: opacity 1s ease;
  filter: blur(0px) saturate(1.1);
}
#hero-bg.loaded { opacity: 0.22; }
#hero-overlay {
  position: absolute; inset: 0;
  background: linear-gradient(to top, var(--bg) 0%, rgba(7,7,13,.7) 50%, rgba(7,7,13,.3) 100%);
}
#hero-content { position: relative; z-index: 2; max-width: 560px; }
.hero-badge {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 4px 10px; border-radius: 20px;
  background: rgba(108,99,255,.2); border: 1px solid rgba(108,99,255,.35);
  font-size: 11px; font-weight: 700; color: var(--accent2);
  letter-spacing: .05em; margin-bottom: 12px;
}
#hero-title {
  font-family: 'Space Grotesk', sans-serif;
  font-size: clamp(22px, 4vw, 38px); font-weight: 700; line-height: 1.15;
  margin-bottom: 8px; letter-spacing: -.02em;
}
#hero-desc {
  font-size: 13.5px; color: var(--text2); line-height: 1.6;
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  margin-bottom: 18px; max-width: 440px;
}
#hero-actions { display: flex; gap: 10px; flex-wrap: wrap; }
.hero-btn {
  display: flex; align-items: center; gap: 7px;
  padding: 10px 22px; border-radius: 10px; border: none;
  font-size: 14px; font-weight: 700; cursor: pointer; transition: all var(--trans);
}
.hero-btn-primary { background: var(--accent); color: #fff; }
.hero-btn-primary:hover { background: #5850e0; transform: translateY(-1px); }
.hero-btn-secondary { background: rgba(255,255,255,.08); color: var(--text); border: 1px solid var(--border2); }
.hero-btn-secondary:hover { background: rgba(255,255,255,.13); }
.hero-meta { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
.hero-tag {
  padding: 3px 9px; border-radius: 5px; font-size: 11px; font-weight: 600;
  background: var(--bg4); color: var(--text2);
}
.hero-score { color: #fbbf24; font-size: 13px; font-weight: 700; }
.hero-ep    { color: var(--text2); font-size: 12px; }

/* Loading state */
.loading-spin {
  width: 20px; height: 20px; border: 2px solid var(--border2);
  border-top-color: var(--accent); border-radius: 50%;
  animation: spin .7s linear infinite; display: inline-block;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* Section */
.section { padding: 28px 24px 4px; }
.section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
.section-title {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 17px; font-weight: 700; letter-spacing: -.01em;
  display: flex; align-items: center; gap: 8px;
}
.section-title .dot {
  width: 5px; height: 5px; border-radius: 50%;
  background: var(--accent); flex-shrink: 0;
}
.see-all {
  font-size: 12px; color: var(--accent2); font-weight: 600; cursor: pointer;
  transition: color var(--trans);
}
.see-all:hover { color: var(--accent); }

/* Genre pills */
#genre-bar {
  display: flex; gap: 8px; padding: 0 24px 20px; overflow-x: auto;
  scrollbar-width: none;
}
#genre-bar::-webkit-scrollbar { display: none; }
.genre-pill {
  padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border2);
  background: var(--bg3); color: var(--text2); font-size: 12px; font-weight: 600;
  cursor: pointer; white-space: nowrap; transition: all var(--trans); flex-shrink: 0;
}
.genre-pill:hover, .genre-pill.active { background: var(--accent); border-color: var(--accent); color: #fff; }

/* Card grids */
.anime-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 16px;
}
.anime-card {
  cursor: pointer; transition: transform var(--trans);
  border-radius: var(--card-r); overflow: hidden;
}
.anime-card:hover { transform: translateY(-4px); }
.card-poster {
  position: relative; padding-top: 145%;
  background: var(--bg3); overflow: hidden;
  border-radius: var(--card-r);
}
.card-poster img {
  position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
  transition: transform .4s ease;
}
.anime-card:hover .card-poster img { transform: scale(1.06); }
.card-score {
  position: absolute; top: 7px; left: 7px;
  background: rgba(0,0,0,.75); backdrop-filter: blur(4px);
  color: #fbbf24; font-size: 11px; font-weight: 700;
  padding: 2px 7px; border-radius: 6px;
  display: flex; align-items: center; gap: 3px;
}
.card-type {
  position: absolute; top: 7px; right: 7px;
  background: var(--accent); color: #fff; font-size: 9px; font-weight: 800;
  padding: 2px 6px; border-radius: 5px; letter-spacing: .05em;
}
.card-ep-badge {
  position: absolute; bottom: 7px; right: 7px;
  background: rgba(0,0,0,.78); backdrop-filter: blur(4px);
  color: var(--text2); font-size: 10px; font-weight: 600;
  padding: 2px 6px; border-radius: 5px;
}
.card-overlay {
  position: absolute; inset: 0;
  background: linear-gradient(to top, rgba(7,7,13,.9) 0%, transparent 60%);
  opacity: 0; transition: opacity .3s;
  display: flex; align-items: flex-end; padding: 10px;
}
.anime-card:hover .card-overlay { opacity: 1; }
.play-icon {
  width: 36px; height: 36px;
  background: var(--accent); border-radius: 50%;
  display: flex; align-items: center; justify-content: center; margin: auto;
}
.card-info { padding: 8px 2px 2px; }
.card-title {
  font-size: 12.5px; font-weight: 600; line-height: 1.3;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.card-sub { font-size: 11px; color: var(--text2); margin-top: 3px; }

/* Horizontal scroll grid */
.h-scroll-wrap { overflow-x: auto; padding: 0 24px 24px; scrollbar-width: none; }
.h-scroll-wrap::-webkit-scrollbar { display: none; }
.h-scroll { display: flex; gap: 14px; }
.h-scroll .anime-card { flex-shrink: 0; width: 140px; }

/* skeleton */
.skeleton { background: linear-gradient(90deg, var(--bg3) 25%, var(--bg4) 50%, var(--bg3) 75%); background-size: 200% 100%; animation: shimmer 1.4s infinite; border-radius: 8px; }
@keyframes shimmer { to { background-position: -200% 0; } }
.skel-card { height: 200px; border-radius: var(--card-r); }

/* ══════════ EPISODE MODAL / PICKER ══════════ */
#ep-modal-bg {
  position: fixed; inset: 0; background: rgba(0,0,0,.75); z-index: 300;
  display: none; align-items: center; justify-content: center;
  backdrop-filter: blur(6px);
  padding: 16px;
}
#ep-modal-bg.show { display: flex; }
#ep-modal {
  background: var(--bg2); border: 1px solid var(--border2);
  border-radius: 20px; width: 100%; max-width: 520px;
  max-height: 88vh; display: flex; flex-direction: column;
  overflow: hidden; box-shadow: 0 32px 80px rgba(0,0,0,.7);
}
#ep-modal-header {
  display: flex; align-items: flex-start; gap: 14px;
  padding: 20px 20px 0;
}
#ep-modal-poster {
  width: 70px; height: 95px; border-radius: 8px; object-fit: cover;
  flex-shrink: 0; background: var(--bg4);
}
#ep-modal-info { flex: 1; min-width: 0; }
#ep-modal-title {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 16px; font-weight: 700; line-height: 1.25; margin-bottom: 6px;
}
#ep-modal-meta { font-size: 12px; color: var(--text2); line-height: 1.6; }
.em-badge {
  display: inline-block; padding: 2px 8px; border-radius: 5px;
  background: var(--bg4); font-size: 11px; color: var(--text2); margin-right: 5px; margin-top: 4px;
}
#ep-modal-close {
  margin-left: auto; background: var(--bg4); border: none; color: var(--text2);
  width: 28px; height: 28px; border-radius: 8px; cursor: pointer; font-size: 16px;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  transition: background var(--trans);
}
#ep-modal-close:hover { background: var(--border2); color: var(--text); }

/* lang toggle in modal */
#em-lang-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 20px 10px;
}
#em-lang-row .label { font-size: 12px; color: var(--text2); font-weight: 600; }
#em-lang-btns {
  display: flex; background: var(--bg4); border: 1px solid var(--border2);
  border-radius: 8px; overflow: hidden;
}
#em-lang-btns button {
  padding: 5px 14px; border: none; background: transparent;
  color: var(--text2); font-size: 12px; font-weight: 700; cursor: pointer;
  transition: all .15s;
}
#em-lang-btns button.active { background: var(--accent); color: #fff; }

/* episode list */
#em-ep-search-wrap { padding: 0 20px 10px; }
#em-ep-search {
  width: 100%; padding: 8px 14px;
  background: var(--bg4); border: 1px solid var(--border2);
  border-radius: 8px; color: var(--text); font-size: 13px; outline: none;
  transition: border-color var(--trans);
}
#em-ep-search:focus { border-color: var(--accent); }
#em-ep-search::placeholder { color: var(--text3); }

#ep-list {
  flex: 1; overflow-y: auto; padding: 0 20px 20px;
  display: grid; grid-template-columns: repeat(auto-fill, minmax(54px, 1fr)); gap: 7px;
}
.ep-btn {
  padding: 10px 4px; border-radius: 8px; border: 1px solid var(--border2);
  background: var(--bg3); color: var(--text2); font-size: 13px; font-weight: 600;
  cursor: pointer; transition: all .15s; text-align: center;
}
.ep-btn:hover  { border-color: var(--accent); color: var(--accent); background: rgba(108,99,255,.1); }
.ep-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
#ep-list-loading { color: var(--text2); font-size: 13px; padding: 20px 0; text-align: center; }

/* ══════════ PLAYER PAGE ══════════ */
#view-player {
  background: var(--bg);
  display: flex; flex-direction: column;
}

#player-topbar {
  display: flex; align-items: center; gap: 10px;
  padding: 0 14px; height: 52px;
  background: var(--bg2); border-bottom: 1px solid var(--border);
  flex-shrink: 0; overflow: hidden;
}
#back-btn {
  display: flex; align-items: center; gap: 6px;
  padding: 6px 12px; border-radius: 8px; border: 1px solid var(--border2);
  background: transparent; color: var(--text2); font-size: 13px; font-weight: 600;
  cursor: pointer; transition: all var(--trans); white-space: nowrap; flex-shrink: 0;
}
#back-btn:hover { border-color: var(--accent); color: var(--accent); }

#player-show-title {
  font-size: 13px; font-weight: 700; white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis; flex: 1;
}
#player-ep-label { font-size: 12px; color: var(--text2); white-space: nowrap; flex-shrink: 0; }

/* lang + autonext */
#player-controls {
  display: flex; align-items: center; gap: 8px; flex-shrink: 0;
}
#player-lang-toggle {
  display: flex; background: var(--bg4); border: 1px solid var(--border2);
  border-radius: 7px; overflow: hidden;
}
#player-lang-toggle button {
  padding: 5px 12px; border: none; background: transparent;
  color: var(--text2); font-size: 11px; font-weight: 700; cursor: pointer; transition: all .15s;
}
#player-lang-toggle button.active { background: var(--accent); color: #fff; }

.switch-sm { position: relative; width: 32px; height: 18px; flex-shrink: 0; }
.switch-sm input { opacity: 0; width: 0; height: 0; }
.slider-sm {
  position: absolute; inset: 0; background: var(--border2);
  border-radius: 18px; cursor: pointer; transition: background .2s;
}
.slider-sm::before {
  content: ''; position: absolute;
  width: 12px; height: 12px; left: 3px; top: 3px;
  background: #fff; border-radius: 50%; transition: transform .2s;
}
.switch-sm input:checked + .slider-sm { background: var(--accent); }
.switch-sm input:checked + .slider-sm::before { transform: translateX(14px); }
.an-label { font-size: 10px; color: var(--text2); font-weight: 600; letter-spacing: .04em; white-space: nowrap; }

/* nav arrows */
.ep-nav-btn {
  display: flex; align-items: center; gap: 4px;
  padding: 6px 10px; border-radius: 7px; border: 1px solid var(--border2);
  background: var(--bg3); color: var(--text2); font-size: 11px; font-weight: 700;
  cursor: pointer; transition: all .15s; white-space: nowrap; flex-shrink: 0;
}
.ep-nav-btn:hover { border-color: var(--accent); color: var(--accent); }

#ep-picker-btn {
  padding: 6px 12px; border-radius: 7px; border: 1px solid var(--border2);
  background: var(--bg3); color: var(--text2); font-size: 11px; font-weight: 700;
  cursor: pointer; transition: all .15s; white-space: nowrap; flex-shrink: 0;
}
#ep-picker-btn:hover { border-color: var(--accent); color: var(--accent); }

#srv-panel-btn {
  display: flex; align-items: center; gap: 5px;
  padding: 6px 12px; border-radius: 7px; border: 1px solid var(--border2);
  background: var(--bg3); color: var(--text2); font-size: 11px; font-weight: 700;
  cursor: pointer; transition: all .15s; white-space: nowrap; flex-shrink: 0;
}
#srv-panel-btn:hover { border-color: var(--accent); color: var(--accent); }
#srv-panel-btn.open  { border-color: var(--accent); color: var(--accent); background: rgba(108,99,255,.12); }

/* player frame */
#player-main { flex: 1; position: relative; background: #000; overflow: hidden; }
#player-main iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
#player-ph {
  position: absolute; inset: 0; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 10px; color: var(--text3);
}

/* Server dropdown */
#server-dropdown {
  position: fixed; z-index: 500;
  background: var(--bg2); border: 1px solid var(--border2);
  border-radius: 14px; padding: 14px 16px;
  min-width: 290px; max-width: 340px;
  box-shadow: 0 12px 40px rgba(0,0,0,.7);
  display: none;
}
#server-dropdown.show { display: block; }

.sd-sec-title {
  font-size: 10px; color: var(--text3); font-weight: 700;
  text-transform: uppercase; letter-spacing: .07em; margin-bottom: 8px;
}
#src-tabs { display: flex; gap: 4px; background: var(--bg); border-radius: 8px; padding: 3px; margin-bottom: 10px; }
.src-t {
  flex: 1; padding: 5px 8px; border: none; border-radius: 6px;
  font-size: 11px; font-weight: 700; cursor: pointer; transition: all .15s;
  background: transparent; color: var(--text3);
}
.src-t.active { background: var(--accent); color: #fff; }
.src-t:hover:not(.active) { color: var(--text2); }

#hi-subsrc-row { display: none; flex-wrap: wrap; gap: 5px; margin-bottom: 8px; }
#hi-subsrc-row.show { display: flex; }
.subsrc-pill {
  padding: 3px 9px; border-radius: 20px; border: 1px solid var(--border2);
  background: var(--bg3); color: var(--text2); font-size: 10px; font-weight: 700;
  cursor: pointer; transition: all .15s;
}
.subsrc-pill.active { background: var(--pink); border-color: var(--pink); color: #fff; }
.subsrc-pill:hover:not(.active) { border-color: var(--pink); color: var(--text); }

#qual-row { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 10px; }
.q-pill {
  padding: 3px 10px; border-radius: 20px; font-size: 10px; font-weight: 800;
  cursor: pointer; border: 1px solid var(--border2); background: var(--bg3); color: var(--text2);
  transition: all .15s;
}
.q-pill.active  { background: var(--accent); border-color: var(--accent); color: #fff; }
.q-pill:hover:not(.active):not(.unavail) { border-color: var(--accent); color: var(--text); }
.q-pill.unavail { opacity: .3; cursor: default; pointer-events: none; }

#srv-list-inner { display: flex; flex-direction: column; gap: 5px; max-height: 200px; overflow-y: auto; }
.srv-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border2);
  background: var(--bg3); color: var(--text2); font-size: 12px; font-weight: 600;
  cursor: pointer; transition: all .15s; width: 100%;
}
.srv-item:hover  { border-color: var(--accent); background: rgba(108,99,255,.12); color: var(--text); }
.srv-item.active { border-color: var(--accent); background: rgba(108,99,255,.22); color: var(--text); }
.srv-item.hi:hover  { border-color: var(--pink); background: rgba(244,114,182,.1); }
.srv-item.hi.active { border-color: var(--pink); background: rgba(244,114,182,.18); }
.srv-badge-sm {
  font-size: 9px; padding: 2px 6px; border-radius: 8px;
  background: var(--bg4); color: var(--text3); font-weight: 700;
}
.srv-item.active .srv-badge-sm { background: var(--accent); color: #fff; }
.srv-item.hi.active .srv-badge-sm { background: var(--pink); color: #fff; }

// ═══════════════════════════════════════════════════════════

const TMDB_API_KEY = '6fad3f86b8452ee232deb7977d7dcf58';
const TMDB_BASE = 'https://api.themoviedb.org/3';
const TMDB_IMG = 'https://image.tmdb.org/t/p/w500';
const TMDB_IMG_LARGE = 'https://image.tmdb.org/t/p/original';
const COUNTDOWN = 10;
const JSON_BASE  = 'https://raw.githubusercontent.com/donkarboy/anisantch_top/refs/heads/main/';
const JSON_FILES = Array.from({length:15},(_,i)=>i===0?'streams.json':`streams_${i+1}.json`);
const HIANIME_BASE = 'https://raw.githubusercontent.com/srtfile/hi_anime_streams_scraper/refs/heads/main/';
const HIANIME_FILES = Array.from({length:20},(_,i)=>i===0?'hianime_streams_list.json':`hianime_streams_list_${i+1}.json`);
const HI_SS = ['streamhg','earnvids','doodstream','vivibebe','bibiemb'];
const Q_TIERS = [360,480,720,1080];

// ═══════════════════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════════════════
let heroAnime    = null;
let modalAnime   = null;
let modalLang    = 'dub';
let playerMalId  = null;
let playerImdbId = null;
let playerEp     = 1;
let playerLang   = 'dub';
let playerIsAnimation = false;
let playerTotal  = 0;
let playerTitle  = '';
let activeSrc    = 'anisantch';
let activeHiSS   = 'streamhg';
let activeQual   = '480';
let serverData   = [];
let hianimeEntry = null;
let activeServer = null;
let prefSrvKey   = null;
let anTimer      = null;
let endWatchInt  = null;
let endWatchClean= null;
let srvPanelOpen = false;
let _hiCacheRaw  = null;
let _hiLoadProm  = null;
let debounceT    = null;

// ═══════════════════════════════════════════════════════════
//  TMDB API
// ═══════════════════════════════════════════════════════════
async function tmdb(path) {
  try {
    const separator = path.includes('?') ? '&' : '?';
    const r = await fetch(`${TMDB_BASE}${path}${separator}api_key=${TMDB_API_KEY}`);
    if (!r.ok) {
      console.error('TMDB API Error:', r.status, r.statusText);
      return null;
    }
    return r.json();
  } catch(err) {
    console.error('TMDB Fetch Error:', err);
    return null;
  }
}

// Normalize TMDB data to match anime structure for compatibility
function normalizeTMDB(item, type = 'tv') {
  return {
    mal_id: item.id,
    id: item.id,
    title: item.name || item.title || 'Untitled',
    title_english: item.name || item.title,
    images: {
      jpg: {
        image_url: item.poster_path ? `${TMDB_IMG}${item.poster_path}` : '',
        small_image_url: item.poster_path ? `${TMDB_IMG}${item.poster_path}` : '',
        large_image_url: item.backdrop_path ? `${TMDB_IMG_LARGE}${item.backdrop_path}` : `${TMDB_IMG}${item.poster_path}`
      }
    },
    score: item.vote_average ? item.vote_average.toFixed(1) : null,
    type: type === 'movie' ? 'Movie' : 'TV',
    episodes: item.number_of_episodes || (type === 'movie' ? 1 : null),
    status: item.status || 'Unknown',
    year: (item.first_air_date || item.release_date || '').split('-')[0],
    synopsis: item.overview || '',
    genres: (item.genres || item.genre_ids || []).map(g => typeof g === 'number' ? {name: genreIdToName(g)} : g),
    rank: item.popularity
  };
}

// TMDB Genre ID to Name mapping
function genreIdToName(id) {
  const map = {
    28: 'Action', 12: 'Adventure', 16: 'Animation', 35: 'Comedy', 80: 'Crime',
    99: 'Documentary', 18: 'Drama', 10751: 'Family', 14: 'Fantasy', 36: 'History',
    27: 'Horror', 10402: 'Music', 9648: 'Mystery', 10749: 'Romance', 878: 'Sci-Fi',
    10770: 'TV Movie', 53: 'Thriller', 10752: 'War', 37: 'Western', 10759: 'Action & Adventure',
    10762: 'Kids', 10763: 'News', 10764: 'Reality', 10765: 'Sci-Fi & Fantasy', 10766: 'Soap',
    10767: 'Talk', 10768: 'War & Politics'
  };
  return map[id] || 'Unknown';
}

function showTitle(a) {
  return a.title_english || a.title || a.name || 'Untitled';
}

// Check if a show is animation - must contain "Animation" in genres
function isAnimation(show) {
  if (!show) return false;
  
  // Check in genres array (normalized or raw)
  if (show.genres && Array.isArray(show.genres)) {
    const hasAnimation = show.genres.some(g => {
      const name = typeof g === 'object' ? (g.name || '') : String(g);
      return name.toLowerCase().includes('animation') || name.toLowerCase().includes('anime');
    });
    if (hasAnimation) return true;
  }
  
  // Check in genre_ids array (TMDB uses 16 for Animation)
  if (show.genre_ids && Array.isArray(show.genre_ids)) {
    if (show.genre_ids.includes(16)) return true;
  }
  
  return false;
}

// Convert TMDB ID to IMDB ID for non-animation shows/movies
async function tmdbToImdbId(tmdbId, mediaType = 'tv') {
  try {
    // Fetch external IDs from TMDB
    const externalIds = await tmdb(`/${mediaType}/${tmdbId}/external_ids`);
    
    if (externalIds && externalIds.imdb_id) {
      console.log(`Found IMDB ID ${externalIds.imdb_id} for TMDB ID ${tmdbId}`);
      return externalIds.imdb_id;
    }
    
    console.log(`Could not find IMDB ID for TMDB ID ${tmdbId}`);
    return null;
  } catch (err) {
    console.error('Error converting TMDB to IMDB ID:', err);
    return null;
  }
}

// Convert TMDB ID to MAL ID using multiple methods
async function tmdbToMalId(tmdbId, show = null) {
  try {
    // First check if the show is animation
    let showData = show;
    if (!showData) {
      showData = await tmdb(`/tv/${tmdbId}`);
      if (!showData) return null;
    }
    
    // Only proceed if it's an animation
    if (!isAnimation(showData)) {
      console.log('Not an animation show, skipping MAL ID conversion');
      return null;
    }
    
    // Method 1: Try Anime-Lists mapping database (most reliable)
    try {
      const mappingUrl = `https://raw.githubusercontent.com/Fribb/anime-lists/refs/heads/master/anime-list-full.json`;
      const mappingResponse = await fetch(mappingUrl);
      
      if (mappingResponse.ok) {
        const mappingData = await mappingResponse.json();
        
        // Search for TMDB ID in the mapping
        // Data structure: themoviedb_id: { tv: 31910 } and mal_id: 1735
        for (const anime of mappingData) {
          // Check if themoviedb_id exists and has tv property
          if (anime.themoviedb_id && anime.themoviedb_id.tv) {
            if (parseInt(anime.themoviedb_id.tv) === parseInt(tmdbId)) {
              if (anime.mal_id) {
                console.log(`Found MAL ID ${anime.mal_id} for TMDB ID ${tmdbId} via Anime-Lists mapping`);
                return anime.mal_id;
              }
            }
          }
        }
      }
    } catch (err) {
      console.log('Anime-Lists mapping lookup failed:', err);
    }
    
    // Method 2: Try ARM (Anime Relations Mapping) database as fallback
    try {
      const armUrl = `https://raw.githubusercontent.com/manami-project/anime-offline-database/master/anime-offline-database.json`;
      const armResponse = await fetch(armUrl);
      
      if (armResponse.ok) {
        const armData = await armResponse.json();
        
        for (const anime of armData.data) {
          // Check if TMDB link exists in sources
          const tmdbLink = anime.sources?.find(s => s.includes('themoviedb.org') && s.includes(`/${tmdbId}`));
          if (tmdbLink) {
            // Find MAL link
            const malLink = anime.sources?.find(s => s.includes('myanimelist.net'));
            if (malLink) {
              const malIdMatch = malLink.match(/myanimelist\.net\/anime\/(\d+)/);
              if (malIdMatch) {
                const malId = parseInt(malIdMatch[1]);
                console.log(`Found MAL ID ${malId} for TMDB ID ${tmdbId} via ARM database`);
                return malId;
              }
            }
          }
        }
      }
    } catch (err) {
      console.log('ARM database lookup failed:', err);
    }
    
    console.log(`Could not find MAL ID for TMDB ID ${tmdbId}`);
    return null;
  } catch (err) {
    console.error('Error converting TMDB to MAL ID:', err);
    return null;
  }
}

async function initHome() {
  loadHero();
  loadAiringRow();
  loadTopRow();
  loadPopularGrid();
}

async function loadHero() {
  // Load popular animation shows only (genre 16 = Animation)
  const d = await tmdb('/discover/tv?with_genres=16&sort_by=popularity.desc&page=1');
  if (!d?.results?.length) return;
  
  // Filter to only shows with Animation genre
  const animatedShows = d.results.filter(item => {
    const normalized = normalizeTMDB(item, 'tv');
    return isAnimation(normalized);
  });
  
  if (!animatedShows.length) return;
  
  // Get a random popular animated show
  heroAnime = normalizeTMDB(animatedShows[Math.floor(Math.random() * Math.min(5, animatedShows.length))], 'tv');
  
  // Fetch full details to get episode count
  const details = await tmdb(`/tv/${heroAnime.id}`);
  if (details) {
    heroAnime.episodes = details.number_of_episodes;
    heroAnime.status = details.status;
    heroAnime.genres = details.genres;
  }
  
  // Double check it's animation
  if (!isAnimation(heroAnime)) {
    console.log('Hero show is not animation, reloading...');
    return loadHero();
  }
  
  const a = heroAnime;
  document.getElementById('hero-title').textContent = showTitle(a);
  document.getElementById('hero-desc').textContent  = a.synopsis?.replace(/\[Written.*\]/,'').trim() || '';

  const meta = document.getElementById('hero-meta');
  meta.innerHTML = '';
  if (a.score) meta.innerHTML += `<span class="hero-score">★ ${a.score}</span>`;
  if (a.episodes) meta.innerHTML += `<span class="hero-ep">${a.episodes} eps</span>`;
  (a.genres||[]).slice(0,3).forEach(g=>{
    meta.innerHTML += `<span class="hero-tag">${g.name}</span>`;
  });

  if (a.images?.jpg?.large_image_url) {
    const bg = document.getElementById('hero-bg');
    const img = new Image();
    img.onload = () => { bg.style.backgroundImage = `url(${img.src})`; bg.classList.add('loaded'); };
    img.src = a.images.jpg.large_image_url;
  }
}

function heroPlay() { if (heroAnime) openEpModal(heroAnime); }

function renderCard(a, mini=false) {
  const div  = document.createElement('div');
  div.className = 'anime-card';
  const img  = a.images?.jpg?.image_url || '';
  const score= a.score ? `★ ${a.score}` : '';
  const eps  = a.episodes ? `${a.episodes} ep` : a.status === 'Returning Series' ? 'On Air' : '';
  const type = a.type || '';
  const animated = isAnimation(a);
  
  div.innerHTML = `
    <div class="card-poster">
      <img src="${img}" alt="" loading="lazy">
      ${score ? `<div class="card-score">${score}</div>`:''}
      ${type  ? `<div class="card-type">${type}</div>`:''}
      ${eps   ? `<div class="card-ep-badge">${eps}</div>`:''}
      ${animated ? `<div class="card-type" style="background:var(--pink);right:auto;left:7px;top:auto;bottom:7px;">ANIME</div>`:''}
      <div class="card-overlay">
        <div class="play-icon"><svg width="12" height="12" viewBox="0 0 24 24" fill="#fff"><polygon points="5 3 19 12 5 21 5 3"/></svg></div>
      </div>
    </div>
    <div class="card-info">
      <div class="card-title">${showTitle(a)}</div>
      <div class="card-sub">${a.year||''}</div>
    </div>`;
  div.onclick = () => openEpModal(a);
  return div;
}

function skeletonCards(n, container, row=false) {
  container.innerHTML = '';
  for (let i=0;i<n;i++) {
    const d = document.createElement('div');
    d.className = row ? 'anime-card' : '';
    if (row) { d.style.flexShrink='0'; d.style.width='140px'; }
    d.innerHTML = `<div class="skeleton skel-card" style="padding-top:${row?'145%':'200px'};border-radius:12px"></div>`;
    container.appendChild(d);
  }
}

async function loadAiringRow() {
  const row = document.getElementById('airing-row');
  skeletonCards(8, row, true);
  // Load only animation shows that are currently on air
  const d = await tmdb('/discover/tv?with_genres=16&sort_by=popularity.desc&air_date.gte=2024-01-01&page=1');
  row.innerHTML = '';
  if (d?.results) {
    // Filter to only include shows with Animation genre
    const animatedShows = d.results.filter(item => {
      const normalized = normalizeTMDB(item, 'tv');
      return isAnimation(normalized);
    });
    animatedShows.forEach(item => row.appendChild(renderCard(normalizeTMDB(item, 'tv'), true)));
  }
}

async function filterGenre(genreId, el) {
  document.querySelectorAll('.genre-pill').forEach(p=>p.classList.remove('active'));
  el.classList.add('active');
  const grid = document.getElementById('popular-grid');
  skeletonCards(12, grid);
  // Always include Animation genre (16) plus the selected genre
  let path;
  if (genreId) {
    path = `/discover/tv?with_genres=16,${genreId}&sort_by=popularity.desc`;
  } else {
    path = '/discover/tv?with_genres=16&sort_by=popularity.desc&page=1';
  }
  const d = await tmdb(path);
  grid.innerHTML = '';
  if (d?.results) {
    // Filter to only include shows with Animation genre
    const animatedShows = d.results.filter(item => {
      const normalized = normalizeTMDB(item, 'tv');
      return isAnimation(normalized);
    });
    animatedShows.forEach(item => grid.appendChild(renderCard(normalizeTMDB(item, 'tv'))));
  }
}

async function loadSection(type) {
  const pathMap = { 
    'top-airing': '/discover/tv?with_genres=16&sort_by=popularity.desc&air_date.gte=2024-01-01&page=1', 
    'top': '/discover/tv?with_genres=16&sort_by=vote_average.desc&vote_count.gte=100&page=1', 
    'popular': '/discover/tv?with_genres=16&sort_by=popularity.desc&page=1'
  };
  const grid = document.getElementById('popular-grid');
  grid.scrollIntoView({ behavior:'smooth' });
  skeletonCards(16, grid);
  const d = await tmdb(pathMap[type] || pathMap.popular);
  grid.innerHTML = '';
  if (d?.results) {
    // Filter to only include shows with Animation genre
    const animatedShows = d.results.filter(item => {
      const normalized = normalizeTMDB(item, 'tv');
      return isAnimation(normalized);
    });
    animatedShows.forEach(item => grid.appendChild(renderCard(normalizeTMDB(item, 'tv'))));
  }
}

const searchInp = document.getElementById('search-inp');
const searchDD  = document.getElementById('search-dropdown');

searchInp.addEventListener('input', () => {
  clearTimeout(debounceT);
  const q = searchInp.value.trim();
  if (!q) { searchDD.classList.remove('show'); return; }
  debounceT = setTimeout(() => doSearch(q), 400);
});

searchInp.addEventListener('keypress', (e) => {
  if (e.key === 'Enter') {
    const q = searchInp.value.trim();
    if (q) doSearch(q);
  }
});

searchInp.addEventListener('focus', () => {
  if (searchInp.value.trim()) {
    searchDD.classList.add('show');
    positionSearchDropdown();
  }
});

// Position search dropdown correctly on mobile
function positionSearchDropdown() {
  const isMobile = window.innerWidth <= 600;
  if (!isMobile) {
    // Desktop: position relative to search input
    searchDD.style.position = 'absolute';
    searchDD.style.top = 'calc(100% + 6px)';
    searchDD.style.left = '0';
    searchDD.style.right = '0';
    searchDD.style.width = 'auto';
  } else {
    // Mobile: position fixed below navbar
    const navbar = document.getElementById('navbar');
    const navbarRect = navbar.getBoundingClientRect();
    searchDD.style.position = 'fixed';
    searchDD.style.top = (navbarRect.bottom + 6) + 'px';
    searchDD.style.left = '10px';
    searchDD.style.right = '10px';
    searchDD.style.width = 'calc(100% - 20px)';
  }
}

document.addEventListener('click', e => {
  if (!e.target.closest('#search-wrap')) searchDD.classList.remove('show');
});

// Reposition search dropdown on window resize
window.addEventListener('resize', () => {
  if (searchDD.classList.contains('show')) {
    positionSearchDropdown();
  }
});

async function doSearch(q) {
  searchDD.innerHTML = '<div style="padding:12px 14px;font-size:12px;color:var(--text2)">Searching…</div>';
  searchDD.classList.add('show');
  positionSearchDropdown();
  
  try {
    console.log('Searching for:', q);
    
    // Search both TV shows and movies using multi search
    const d = await tmdb(`/search/multi?query=${encodeURIComponent(q)}&page=1`);
    
    console.log('Search results:', d);
    
    searchDD.innerHTML = '';
    
    if (!d?.results?.length) {
      searchDD.innerHTML = '<div style="padding:12px 14px;font-size:12px;color:var(--text2)">No results found.</div>';
      return;
    }
    
    console.log('Total results:', d.results.length);
    
    // Filter only TV and movie results, show all genres - increased to 12 results
    const filteredResults = d.results.filter(item => {
      const isValid = item.media_type === 'tv' || item.media_type === 'movie';
      if (isValid) {
        console.log('Valid result:', item.name || item.title, 'Type:', item.media_type);
      }
      return isValid;
    }).slice(0, 12);
    
    console.log('Filtered results count:', filteredResults.length);
    
    if (filteredResults.length === 0) {
      searchDD.innerHTML = '<div style="padding:12px 14px;font-size:12px;color:var(--text2)">No TV shows or movies found.</div>';
      return;
    }
    
    // Show all results (no animation filter for search)
    filteredResults.forEach(item => {
      const mediaType = item.media_type === 'movie' ? 'movie' : 'tv';
      const a = normalizeTMDB(item, mediaType);
      const searchItem = document.createElement('div');
      searchItem.className = 'sd-item';
      const typeLabel = mediaType === 'movie' ? 'Movie' : 'TV';
      searchItem.innerHTML = `
        <img class="sd-img" src="${a.images?.jpg?.small_image_url||''}" alt="" loading="lazy">
        <div class="sd-info">
          <div class="sd-title">${showTitle(a)}</div>
          <div class="sd-meta">${typeLabel} · ${a.year||'—'}${a.episodes ? ' · '+a.episodes+' eps' : ''}</div>
          ${a.score ? `<div class="sd-score">★ ${a.score}</div>`:''}
        </div>`;
      searchItem.onclick = () => { 
        searchDD.classList.remove('show'); 
        searchInp.value=''; 
        openEpModal(a); 
      };
      searchDD.appendChild(searchItem);
    });
  } catch (err) {
    console.error('Search error:', err);
    searchDD.innerHTML = '<div style="padding:12px 14px;font-size:12px;color:var(--text2)">Search failed. Please try again.</div>';
  }
}

async function openEpModal(show) {
  modalAnime = show;
  modalLang  = 'dub';
  document.getElementById('em-dub').classList.add('active');
  document.getElementById('em-sub').classList.remove('active');
  document.getElementById('ep-modal-title').textContent = showTitle(show);
  document.getElementById('ep-modal-poster').src = show.images?.jpg?.image_url || '';

  const meta = document.getElementById('ep-modal-meta');
  meta.innerHTML = '';
  if (show.score)    meta.innerHTML += `<span class="em-badge">★ ${show.score}</span>`;
  if (show.type)     meta.innerHTML += `<span class="em-badge">${show.type}</span>`;
  if (show.status)   meta.innerHTML += `<span class="em-badge">${show.status}</span>`;
  if (show.episodes) meta.innerHTML += `<span class="em-badge">${show.episodes} eps</span>`;

  document.getElementById('ep-list').innerHTML = '<div id="ep-list-loading"><div class="loading-spin"></div></div>';
  document.getElementById('ep-modal-bg').classList.add('show');
  document.getElementById('em-ep-search').value = '';

  // Fetch full TV show details including episode count
  let total = show.episodes || 0;
  let fullShowData = show;
  const mediaType = show.type === 'Movie' ? 'movie' : 'tv';
  
  if (!total && show.id) {
    const d = await tmdb(`/${mediaType}/${show.id}`);
    total = d?.number_of_episodes || (mediaType === 'movie' ? 1 : 0);
    if (d) {
      fullShowData = normalizeTMDB(d, mediaType);
      fullShowData.episodes = total;
      fullShowData.genres = d.genres;
      modalAnime = fullShowData;
      if (!show.episodes && total) document.getElementById('ep-modal-meta').innerHTML += `<span class="em-badge">${total} eps</span>`;
    }
  }
  
  // Check if animation and convert accordingly
  if (isAnimation(fullShowData)) {
    // Animation: Convert TMDB ID to MAL ID
    meta.innerHTML += `<span class="em-badge" style="background:var(--accent);color:#fff">Converting ID...</span>`;
    const malId = await tmdbToMalId(fullShowData.id, fullShowData);
    if (malId) {
      modalAnime.mal_id = malId;
      modalAnime.imdb_id = null; // Clear IMDB ID for anime
      const badges = meta.querySelectorAll('.em-badge');
      badges[badges.length - 1].textContent = 'Anime (MAL)';
      badges[badges.length - 1].style.background = 'var(--accent)';
      badges[badges.length - 1].style.color = '#fff';
      console.log(`Using MAL ID ${malId} for anime streaming`);
    } else {
      const badges = meta.querySelectorAll('.em-badge');
      if (badges[badges.length - 1].textContent === 'Converting ID...') {
        badges[badges.length - 1].remove();
      }
    }
  } else {
    // Non-animation: Convert TMDB ID to IMDB ID
    meta.innerHTML += `<span class="em-badge" style="background:var(--pink);color:#fff">Getting IMDB ID...</span>`;
    const imdbId = await tmdbToImdbId(fullShowData.id, mediaType);
    if (imdbId) {
      modalAnime.imdb_id = imdbId;
      modalAnime.mal_id = null; // Clear MAL ID for non-anime
      const badges = meta.querySelectorAll('.em-badge');
      badges[badges.length - 1].textContent = `IMDB: ${imdbId}`;
      badges[badges.length - 1].style.background = 'var(--pink)';
      badges[badges.length - 1].style.color = '#fff';
      console.log(`Using IMDB ID ${imdbId} for streaming`);
    } else {
      const badges = meta.querySelectorAll('.em-badge');
      if (badges[badges.length - 1].textContent === 'Getting IMDB ID...') {
        badges[badges.length - 1].remove();
      }
    }
  }
  
  playerTotal = total || 999;
  renderEpList(total || 999);
}

function renderEpList(total) {
  const list = document.getElementById('ep-list');
  list.innerHTML = '';
  const count = Math.min(total, 500);
  for (let i=1;i<=count;i++) {
    const btn = document.createElement('button');
    btn.className = 'ep-btn';
    btn.textContent = i;
    btn.onclick = () => startWatch(modalAnime, i, modalLang);
    list.appendChild(btn);
  }
  if (total > 500) {
    const more = document.createElement('div');
    more.style.cssText = 'grid-column:1/-1;font-size:11px;color:var(--text2);padding:8px 0;';
    more.textContent = `Showing first 500 of ${total} episodes.`;
    list.appendChild(more);
  }
  document.getElementById('em-ep-search').addEventListener('input', function(){
    const v = parseInt(this.value);
    if (!isNaN(v) && v >= 1 && v <= total) {
      document.querySelectorAll('.ep-btn').forEach(b=>b.classList.toggle('active', +b.textContent===v));
      const target = list.children[v-1];
      if (target) target.scrollIntoView({ block:'center', behavior:'smooth' });
    }
  });
}

function setModalLang(lang) {
  modalLang = lang;
  document.getElementById('em-dub').classList.toggle('active', lang==='dub');
  document.getElementById('em-sub').classList.toggle('active', lang==='sub');
}

function closeEpModal() {
  document.getElementById('ep-modal-bg').classList.remove('show');
}
document.getElementById('ep-modal-bg').addEventListener('click', e => {
  if (e.target === document.getElementById('ep-modal-bg')) closeEpModal();
});

// ═══════════════════════════════════════════════════════════
//  START WATCH — transition to player
// ═══════════════════════════════════════════════════════════
function startWatch(show, ep, lang) {
  closeEpModal();
  // Store both MAL ID and IMDB ID
  playerMalId = show.mal_id || show.id; // For anime
  playerImdbId = show.imdb_id || null;  // For non-anime
  playerEp    = ep;
  playerLang  = lang;
  playerTitle = showTitle(show);
  playerTotal = show.episodes || playerTotal || 999;
  playerIsAnimation = isAnimation(show);

  document.getElementById('view-player').classList.add('active');
  document.getElementById('view-home').classList.add('hidden');
  document.getElementById('player-show-title').textContent = playerTitle;
  document.getElementById('player-ep-label').textContent   = `Episode ${ep}`;
  document.getElementById('pl-dub').classList.toggle('active', lang==='dub');
  document.getElementById('pl-sub').classList.toggle('active', lang==='sub');

  loadEpisode(playerMalId, ep, lang, playerImdbId);
}

function goHome() {
  cancelAN();
  stopEndWatch();
  document.getElementById('view-player').classList.remove('active');
  document.getElementById('view-home').classList.remove('hidden');
  document.getElementById('pf-plain').src = 'about:blank';
  document.getElementById('pf-sb').src    = 'about:blank';
  document.getElementById('pf-plain').style.display = 'none';
  document.getElementById('pf-sb').style.display    = 'none';
  document.getElementById('player-ph').style.display = 'flex';
  closeSrvPanel();
}

function openEpPickerFromPlayer() {
  if (!modalAnime || (modalAnime.id || modalAnime.mal_id) !== playerMalId) {
    if (playerMalId) {
      tmdb(`/tv/${playerMalId}`).then(d => {
        if (d) { 
          const show = normalizeTMDB(d, 'tv');
          openEpModal(show); 
          modalLang = playerLang; 
          setModalLang(playerLang); 
        }
      });
    }
    return;
  }
  setModalLang(playerLang);
  document.getElementById('ep-modal-bg').classList.add('show');
}

// ═══════════════════════════════════════════════════════════
//  LOAD EPISODE
// ═══════════════════════════════════════════════════════════
async function loadEpisode(malId, ep, lang, imdbId = null) {
  cancelAN();
  stopEndWatch();
  playerMalId = malId; 
  playerImdbId = imdbId;
  playerEp = ep; 
  playerLang = lang;
  document.getElementById('player-ep-label').textContent = `Episode ${ep}`;

  // If it's not animation and we have IMDB ID, use insertunit.ws embed
  if (imdbId && !playerIsAnimation) {
    const imdbSrc = `https://api.insertunit.ws/embed/imdb/${imdbId}`;
    console.log(`Loading non-anime with IMDB ID: ${imdbId}`);
    loadIframe(imdbSrc, true); // Use ad-blocking iframe
    
    // For non-anime, we don't need server panel functionality
    document.getElementById('qual-row').innerHTML = '';
    document.getElementById('srv-list-inner').innerHTML = '<div style="font-size:12px;color:var(--text2);padding:6px 0">Streaming via IMDB embed</div>';
    document.getElementById('srv-loading').classList.remove('show');
    
    const activeFrame = document.getElementById('pf-sb');
    watchEnd(activeFrame, imdbId, ep, lang);
    return;
  }

  // Animation path: Use megaplay default immediately
  const megaSrc = `https://megaplay.buzz/stream/mal/${malId}/${ep}/${lang}?autostart=true`;
  loadIframe(megaSrc);

  // Reset server panel
  serverData   = [];
  hianimeEntry = null;
  activeServer = null;
  document.getElementById('qual-row').innerHTML     = '';
  document.getElementById('srv-list-inner').innerHTML = '';
  document.getElementById('srv-loading').classList.add('show');

  const [aEntry, hiEntry] = await Promise.all([
    fetchACEntry(malId, ep, lang),
    fetchHiEntry(malId, ep),
  ]);

  document.getElementById('srv-loading').classList.remove('show');
  if (aEntry)  serverData   = buildACSrvs(aEntry);
  if (hiEntry) hianimeEntry = hiEntry;
  updateSrcTabOpacity();
  if (activeSrc === 'hianime') renderHiList();
  else renderACList();
  if (!serverData.length && hianimeEntry && activeSrc === 'anisantch') switchSrc('hianime');

  // Watch for end
  const activeFrame = document.getElementById('pf-plain').style.display !== 'none'
    ? document.getElementById('pf-plain') : document.getElementById('pf-sb');
  watchEnd(activeFrame, malId, ep, lang);
}

// ═══════════════════════════════════════════════════════════
//  IFRAME MANAGEMENT
// ═══════════════════════════════════════════════════════════
function isMega(url) { return /megaplay\.buzz/i.test(url); }
function isInsertUnit(url) { return /insertunit\.ws/i.test(url); }

function loadIframe(url, forceAdBlock = false) {
  const plain = document.getElementById('pf-plain');
  const sb    = document.getElementById('pf-sb');
  const ph    = document.getElementById('player-ph');
  stopEndWatch();
  ph.style.display = 'none';
  
  // Use ad-blocking sandbox for insertunit.ws or when forceAdBlock is true
  if (isInsertUnit(url) || forceAdBlock) {
    plain.style.display='none'; plain.src='about:blank';
    sb.src=url; sb.style.display='block';
    console.log('Using ad-blocking sandbox iframe');
  } else if (isMega(url)) {
    sb.style.display='none'; sb.src='about:blank';
    plain.src=url; plain.style.display='block';
  } else {
    plain.style.display='none'; plain.src='about:blank';
    sb.src=url; sb.style.display='block';
  }
}

// ═══════════════════════════════════════════════════════════
//  ANISANTCH FETCH + BUILD
// ═══════════════════════════════════════════════════════════
async function fetchACEntry(malId, ep, lang) {
  const key    = `${malId}/${ep}==${lang}`;
  const altKey = `${malId}/${ep}==${lang==='dub'?'sub':'dub'}`;
  const res = await Promise.all(JSON_FILES.map(f=>fetch(JSON_BASE+f).then(r=>r.ok?r.json():[]).catch(()=>[])));
  const all = res.flat();
  return all.find(e=>e.mal_id_with_ep_and_stream_type===key) || all.find(e=>e.mal_id_with_ep_and_stream_type===altKey) || null;
}

function getAllanimeUrl(entry, q) {
  const want=parseInt(q,10);
  const avail=Q_TIERS.filter(t=>entry[`allanime_${t}`]);
  if (!avail.length) return null;
  const best=avail.reduce((a,b)=>Math.abs(a-want)<=Math.abs(b-want)?a:b);
  return entry[`allanime_${best}`]||null;
}

function buildACSrvs(entry) {
  const s=[];
  if (Q_TIERS.some(q=>entry[`allanime_${q}`])) s.push({key:'allanime',label:'AllanimeHD',type:'multi-quality',entry,source:'anisantch'});
  if (entry.anivibe) s.push({key:'anivibe',label:'AniVibe',url:entry.anivibe,source:'anisantch'});
  if (entry.okcdn)   s.push({key:'okcdn',label:'OkCDN',url:entry.okcdn,source:'anisantch'});
  const cdn=getAnicdnUrl(entry);
  if (cdn) s.push({key:'anicdn',label:'AniCDN',badge:'Multi-Lang',url:cdn,source:'anisantch'});
  const sw=getSwiftUrl(entry);
  if (sw)  s.push({key:'swift',label:'Swift',badge:'HI',url:sw,source:'anisantch'});
  return s;
}

function getAnicdnUrl(e) {
  const raw=e.anicdn_iframe||e.anicdn; if(!raw)return null;
  const m=raw.match(/\/anicdn\/([^/]+)/); return m?`https://as-cdn21.top/video/${m[1]}`:null;
}
function getSwiftUrl(e) {
  const raw=e.swift_iframe||e.swift; if(!raw)return null;
  const m=raw.match(/\/swift\/([^/]+)/); return m?`https://argon.razorshell.space/embed/${m[1]}`:null;
}

// ═══════════════════════════════════════════════════════════
//  HIANIME FETCH + BUILD
// ═══════════════════════════════════════════════════════════
async function loadHiRaw() {
  if (_hiCacheRaw) return _hiCacheRaw;
  if (_hiLoadProm) return _hiLoadProm;
  _hiLoadProm = Promise.all(HIANIME_FILES.map(f=>fetch(HIANIME_BASE+f).then(r=>r.ok?r.json():[]).catch(()=>[])))
    .then(res=>{ _hiCacheRaw=res.flat().filter(Boolean); _hiLoadProm=null; return _hiCacheRaw; });
  return _hiLoadProm;
}

async function fetchHiEntry(malId, ep) {
  const all = await loadHiRaw();
  const mid=parseInt(malId,10), epn=parseInt(ep,10);
  return all.find(e=>parseInt(e['mal_id/anilist_id/tmdb_id'],10)===mid && parseInt(e.episode_no,10)===epn)||null;
}

function getHiUrl(entry, lang, ss) {
  for (const p of lang==='sub'?[lang,'hsub']:[lang]) {
    const k=`${p}_${ss}_embed_url_ep_${entry.episode_no}`;
    if (entry[k]) return entry[k];
  }
  return null;
}

function buildHiSrvs(entry, lang) {
  return HI_SS.flatMap(ss=>{
    const url=getHiUrl(entry,lang,ss);
    return url?[{key:'hi_'+ss,label:ss.charAt(0).toUpperCase()+ss.slice(1),url,source:'hianime',subsrc:ss}]:[];
  });
}

// ═══════════════════════════════════════════════════════════
//  SERVER PANEL
// ═══════════════════════════════════════════════════════════
function toggleSrvPanel() {
  srvPanelOpen = !srvPanelOpen;
  const panel = document.getElementById('server-dropdown');
  const btn   = document.getElementById('srv-panel-btn');
  panel.classList.toggle('show', srvPanelOpen);
  btn.classList.toggle('open', srvPanelOpen);
  if (srvPanelOpen) {
    const r = btn.getBoundingClientRect();
    panel.style.top  = (r.bottom+6)+'px';
    panel.style.left = Math.min(r.left, window.innerWidth-350)+'px';
  }
}
function closeSrvPanel() {
  srvPanelOpen=false;
  document.getElementById('server-dropdown').classList.remove('show');
  document.getElementById('srv-panel-btn').classList.remove('open');
}

function switchSrc(src) {
  activeSrc=src;
  document.getElementById('tab-ac').classList.toggle('active',src==='anisantch');
  document.getElementById('tab-hi').classList.toggle('active',src==='hianime');
  const hiRow=document.getElementById('hi-subsrc-row');
  const qRow =document.getElementById('qual-row');
  if (src==='hianime') { hiRow.classList.add('show'); qRow.style.display='none'; renderHiList(); }
  else { hiRow.classList.remove('show'); qRow.style.display=''; renderACList(); }
}

function setHiSS(ss) {
  activeHiSS=ss;
  document.querySelectorAll('.subsrc-pill').forEach(p=>p.classList.toggle('active',p.dataset.ss===ss));
  renderHiList();
}

function updateSrcTabOpacity() {
  document.getElementById('tab-ac').style.opacity = serverData.length?'1':'0.4';
  document.getElementById('tab-hi').style.opacity = hianimeEntry?'1':'0.4';
}

function renderACList() {
  const qRow=document.getElementById('qual-row');
  const list=document.getElementById('srv-list-inner');
  qRow.innerHTML=''; list.innerHTML=''; qRow.style.display='';
  if (!serverData.length) { list.innerHTML='<div style="font-size:12px;color:var(--text2);padding:6px 0">No AnisantCH servers for this episode.</div>'; return; }
  const allanime=serverData.find(s=>s.type==='multi-quality');
  if (allanime) {
    Q_TIERS.forEach(q=>{
      const avail=!!allanime.entry[`allanime_${q}`];
      const pill=document.createElement('button');
      pill.className='q-pill'+(q===parseInt(activeQual)?' active':'')+(avail?'':' unavail');
      pill.textContent=q+'p';
      if (avail) pill.onclick=()=>{
        activeQual=String(q);
        document.querySelectorAll('.q-pill').forEach(p=>p.classList.remove('active'));
        pill.classList.add('active');
        if (activeServer?.key==='allanime') playSrv(activeServer);
      };
      qRow.appendChild(pill);
    });
  }
  const defIdx=prefSrvKey?serverData.findIndex(s=>s.key===prefSrvKey&&s.source==='anisantch'):0;
  const di=defIdx>=0?defIdx:0;
  serverData.forEach((srv,i)=>{
    const btn=document.createElement('button');
    btn.className='srv-item'+(i===di?' active':'');
    btn.innerHTML=`<span>${srv.label}</span><span class="srv-badge-sm">${srv.badge||'HD'}</span>`;
    btn.onclick=()=>{ document.querySelectorAll('.srv-item').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); activeServer=srv; prefSrvKey=srv.key; playSrv(srv); };
    list.appendChild(btn);
    if (i===di) activeServer=srv;
  });
  if (serverData[di]) playSrv(serverData[di]);
}

function renderHiList() {
  const list=document.getElementById('srv-list-inner');
  list.innerHTML='';
  if (!hianimeEntry) { list.innerHTML='<div style="font-size:12px;color:var(--text2);padding:6px 0">No HiAnime data for this episode.</div>'; return; }
  const srvs=buildHiSrvs(hianimeEntry, playerLang);
  if (!srvs.length) { list.innerHTML=`<div style="font-size:12px;color:var(--text2);padding:6px 0">No HiAnime ${playerLang.toUpperCase()} streams found.</div>`; return; }
  const di=Math.max(0,srvs.findIndex(s=>s.subsrc===activeHiSS));
  srvs.forEach((srv,i)=>{
    const btn=document.createElement('button');
    btn.className='srv-item hi'+(i===di?' active':'');
    btn.innerHTML=`<span>${srv.label}</span><span class="srv-badge-sm">HiAnime</span>`;
    btn.onclick=()=>{ document.querySelectorAll('.srv-item').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); activeServer=srv; prefSrvKey=srv.key; activeHiSS=srv.subsrc; setHiSS(srv.subsrc); playSrv(srv); };
    list.appendChild(btn);
    if (i===di) activeServer=srv;
  });
  if (srvs[di]) playSrv(srvs[di]);
}

function playSrv(srv) {
  let url;
  if (srv.type==='multi-quality') {
    url=getAllanimeUrl(srv.entry,activeQual);
    if (!url) for (const q of [480,720,360,1080]) { url=srv.entry[`allanime_${q}`]; if(url)break; }
  } else { url=srv.url; }
  if (!url) return;
  loadIframe(url);
  const frame=isMega(url)?document.getElementById('pf-plain'):document.getElementById('pf-sb');
  watchEnd(frame, playerMalId, playerEp, playerLang);
}

// ═══════════════════════════════════════════════════════════
//  PLAYER NAV
// ═══════════════════════════════════════════════════════════
function playerSetLang(lang) {
  playerLang=lang;
  document.getElementById('pl-dub').classList.toggle('active',lang==='dub');
  document.getElementById('pl-sub').classList.toggle('active',lang==='sub');
  loadEpisode(playerMalId, playerEp, lang);
}
function playerPrev() { if (playerEp>1) loadEpisode(playerMalId, --playerEp, playerLang), document.getElementById('player-ep-label').textContent=`Episode ${playerEp}`; }
function playerNext() { loadEpisode(playerMalId, ++playerEp, playerLang); document.getElementById('player-ep-label').textContent=`Episode ${playerEp}`; }

// ═══════════════════════════════════════════════════════════
//  END WATCH + AUTO-NEXT
// ═══════════════════════════════════════════════════════════
function stopEndWatch() {
  clearInterval(endWatchInt); endWatchInt=null;
  if (endWatchClean) { endWatchClean(); endWatchClean=null; }
}

function watchEnd(iframe, malId, ep, lang) {
  stopEndWatch();
  let active=true;
  function onMsg(e) {
    if (!active) return;
    const str=typeof e.data==='string'?e.data:JSON.stringify(e.data||'');
    if (/ended|complete|finish|event.*end/i.test(str)) { cleanup(); triggerAN(malId,ep,lang); }
  }
  window.addEventListener('message',onMsg);
  let settled=false;
  const st=setTimeout(()=>{settled=true;},1500);
  endWatchInt=setInterval(()=>{
    if (!active||!settled) return;
    try { const s=iframe.src||''; if (s===''||s==='about:blank') { cleanup(); triggerAN(malId,ep,lang); } } catch(_){}
  },2000);
  function cleanup() { active=false; clearTimeout(st); clearInterval(endWatchInt); endWatchInt=null; window.removeEventListener('message',onMsg); endWatchClean=null; }
  endWatchClean=cleanup;
}

function triggerAN(malId, ep, lang) {
  if (!document.getElementById('chk-an').checked) return;
  const next=parseInt(ep,10)+1;
  document.getElementById('an-ep-lbl').textContent=`Episode ${next}`;
  const overlay=document.getElementById('an-overlay');
  const bar=document.getElementById('an-bar');
  overlay.style.display='block';
  bar.style.transition='none'; bar.style.transform='scaleX(1)';
  bar.getBoundingClientRect();
  bar.style.transition=`transform ${COUNTDOWN}s linear`; bar.style.transform='scaleX(0)';
  let rem=COUNTDOWN;
  anTimer=setInterval(()=>{ if(--rem<=0) anPlayNow(); },1000);
}

function anPlayNow() { cancelAN(); playerNext(); }
function cancelAN() {
  clearInterval(anTimer); anTimer=null;
  const ov=document.getElementById('an-overlay'); if(ov) ov.style.display='none';
  stopEndWatch();
}

initHome();
